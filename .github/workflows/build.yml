name: Remote Build APK
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Execute Build
        run: |
          # 1. 先清除掉所有可能衝突的環境變數
          unset ANDROID_HOME
          unset ANDROID_SDK_ROOT
          
          # 2. 建立捷徑騙過 make.sh
          # 這次我們把系統 SDK 直接軟連結到當前目錄
          ln -s /usr/local/lib/android/sdk ./cmdline-tools
          
          # 3. 重新定義唯一路徑 (這點最關鍵：兩個變數必須完全一致)
          # 指向我們剛才建立的捷徑路徑
          export ANDROID_HOME=$GITHUB_WORKSPACE/cmdline-tools
          export ANDROID_SDK_ROOT=$GITHUB_WORKSPACE/cmdline-tools
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH

          # 4. 同意授權 (使用我們定義的新路徑下的工具)
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # 5. 確保版本正確
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;30.0.3"

          # 6. 執行編譯
          chmod +x make.sh
          yes "" | ./make.sh keygen || true
          ./make.sh build
          
      - name: Upload Result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Output
          path: |
            ./*.apk
            ./out/*.apk

      # 關鍵步驟：幫它的腳本準備好 Android SDK 工具
      - name: Setup Android SDK
        run: |
          mkdir -p cmdline-tools
          # 下載 Android 官方命令列工具
          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip cmdline-tools.zip -d cmdline-tools
          # 腳本預期路徑可能是 cmdline-tools/bin...
          mv cmdline-tools/cmdline-tools/* cmdline-tools/ 2>/dev/null || true
          
      - name: Execute Keygen
        run: |
          chmod +x make.sh
          # 自動化輸入 keygen 資訊，避免腳本卡在詢問介面
          # 這裡假設 keygen 需要一些輸入，我們用 yes 命令填充
          yes "" | ./make.sh keygen || true

      - name: Execute Build
        run: |
          # 1. 統一路徑環境變數
          export ANDROID_HOME=$GITHUB_WORKSPACE/cmdline-tools
          export ANDROID_SDK_ROOT=$GITHUB_WORKSPACE/cmdline-tools
          export PATH=$PATH:$ANDROID_HOME/bin:$ANDROID_HOME/cmdline-tools/bin
          
          # 2. 自動同意所有 Android SDK 授權 (關鍵步驟)
          # 使用 yes 命令將 "y" 傳給 sdkmanager
          mkdir -p "$ANDROID_HOME/licenses"
          yes | ./cmdline-tools/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses || true
          
          # 3. 預先安裝缺失的組件 (預防萬一)
          ./cmdline-tools/bin/sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-33" "build-tools;30.0.3"
          
          # 4. 執行實際編譯
          chmod +x make.sh
          ./make.sh build
          
          
      - name: Upload Result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # 使用動態名稱，避免 409 Conflict 錯誤
          name: ChatApp-APK-${{ github.run_number }}
          path: |
            **/*.apk
          # 如果沒找到檔案，不要讓整個 Workflow 顯示失敗
          if-no-files-found: warn
