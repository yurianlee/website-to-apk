name: Remote Build APK
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true # 預防萬一沒有這個檔案

      - name: Execute Build Script
        # 這裡我們略過 keygen，直接用 debug 模式編譯，省去簽署麻煩
        run: |
          chmod +x make.sh
          ./make.sh build
        env:
          # 這裡可以根據該專案的說明文件加入需要的環境變數
          URL: "http://192.168.x.x:3000" 

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: MyChatApp
          path: ./**/*.apk
