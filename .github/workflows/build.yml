name: Remote Build APK
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 關鍵步驟：幫它的腳本準備好 Android SDK 工具
      - name: Setup Android SDK
        run: |
          mkdir -p cmdline-tools
          # 下載 Android 官方命令列工具
          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip cmdline-tools.zip -d cmdline-tools
          # 腳本預期路徑可能是 cmdline-tools/bin...
          mv cmdline-tools/cmdline-tools/* cmdline-tools/ 2>/dev/null || true
          
      - name: Execute Keygen
        run: |
          chmod +x make.sh
          # 自動化輸入 keygen 資訊，避免腳本卡在詢問介面
          # 這裡假設 keygen 需要一些輸入，我們用 yes 命令填充
          yes "" | ./make.sh keygen || true

      - name: Execute Build
        run: |
          # 執行實際編譯
          ./make.sh build
          
      - name: Upload Result
        if: always() # 就算失敗也上傳日誌，方便我們檢查
        uses: actions/upload-artifact@v4
        with:
          name: Build-Output
          path: |
            ./*.apk
            ./out/*.apk
            ./*.log
